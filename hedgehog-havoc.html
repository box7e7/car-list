<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
const { Engine, Bodies, Body, Events, Composite } = Matter;
const W = 1280, H = 720, GY = 640, AX = 190, AY = 500, MAXPULL = 120, POWER = 0.17, G = 0.2778;
const $ = id => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d'), play = $('play'), overlay = $('overlay');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const MATS = {
  ice:   { hp: 25,  den: 0.0008, fill: '#9fe0ee', edge: '#e9fbff' },
  wood:  { hp: 55,  den: 0.001,  fill: '#c98a4b', edge: '#7d4a20' },
  stone: { hp: 125, den: 0.0025, fill: '#8d90a6', edge: '#55586e' },
  keg:   { hp: 12,  den: 0.001,  fill: '#b23a2c', edge: '#5a1710' },
};
const DIFFS = {
  easy:   { label: 'Easy',   block: 0.8, coon: 0.8, extra: 1, dots: 90, mult: 0.75, desc: 'One extra hedgehog, weaker forts and a full aim arc. Scores count x0.75.' },
  normal: { label: 'Normal', block: 1,   coon: 1,   extra: 0, dots: 48, mult: 1,    desc: 'The standard challenge.' },
  hard:   { label: 'Hard',   block: 1.3, coon: 1.5, extra: 0, dots: 20, mult: 1.5,  desc: 'Tougher forts and bandits, and only a short aim arc. Scores count x1.5.' },
};
const WORLDS = {
  forest: { name: 'Dusk Forest', note: '', sky: ['#1d1a3a', '#4a2f5e', '#c4594f', '#f39a55'], stars: 70,
    orb: { x: 1050, y: 130, r: 54, col: '#f6ead7', spot: '#e3d3ba' },
    ridges: [['hill', 470, 40, '#5a2f5c', 0], ['hill', 540, 26, '#3b2450', 26], ['hill', 596, 16, '#271a3e', 34]],
    tree: 'pine', ground: ['#2f5d4a', '#16302b'], lip: '#4c8a66', blades: true, dot: '#f6ead7' },
  peaks: { name: 'Frozen Peaks', note: 'Icy ground: everything slides.', slip: true, sky: ['#0b1f3a', '#16466b', '#3f8ea3', '#bfe6e4'], stars: 90, aurora: true,
    orb: { x: 240, y: 120, r: 40, col: '#eef7ff', spot: '#cfe0ee' },
    ridges: [['peak', 430, 120, '#7ea6bd', 0], ['peak', 525, 70, '#4f7d99', 0], ['hill', 598, 14, '#2c5672', 22]],
    tree: 'snowpine', ground: ['#eef6f9', '#9dbccd'], lip: '#ffffff', blades: false, dot: '#0b1f3a' },
  canyon: { name: 'Ember Canyon', note: 'Red powder kegs explode when broken.', sky: ['#3a1c4a', '#a23b4f', '#f07c3c', '#ffd27a'], stars: 25,
    orb: { x: 880, y: 500, r: 90, col: '#fff1c4' },
    ridges: [['mesa', 440, 80, '#b5533c', 0], ['mesa', 535, 45, '#8a3a32', 0], ['hill', 602, 10, '#5e2630', 9]],
    tree: 'cactus', ground: ['#c9853f', '#7a4420'], lip: '#e3a85c', blades: false, dot: '#3a1c4a' },
};
const HOGS = {
  bramble: { name: 'Bramble', r: 20, den: 0.004, col: '#a06c47', spike: '#4a2c1c', tip: 'No trick, just a solid hit.' },
  zip:     { name: 'Zip',     r: 17, den: 0.004, col: '#e9b23a', spike: '#8a5a10', tip: 'Tap mid-flight to dash forward.' },
  thump:   { name: 'Thump',   r: 26, den: 0.005, col: '#6f80a8', spike: '#2c3550', tip: 'Tap mid-flight to slam straight down.' },
  blaze:   { name: 'Blaze',   r: 20, den: 0.004, col: '#e0553f', spike: '#7a1d12', tip: 'Tap mid-flight to burst and blast everything nearby.' },
};
const b = (mat, x, y, w, h) => ({ k: 'block', mat, x, y, w, h });
const c = (x, y) => ({ k: 'coon', x, y });
const tower = (x, base, top) => [
  b(base, x - 35, 0, 20, 90), b(base, x + 35, 0, 20, 90), b('wood', x, 90, 110, 20), c(x, 0),
  b(top, x - 35, 110, 20, 70), b(top, x + 35, 110, 20, 70), b('wood', x, 180, 110, 20), c(x, 110),
];
const hut = x => [b('stone', x - 35, 0, 20, 70), b('stone', x + 35, 0, 20, 70), b('stone', x, 70, 110, 20), c(x, 0), b('keg', x, 90, 40, 40)];
const step = (x, n) => [...Array.from({ length: n }, (_, i) => b('stone', x, i * 40, 70, 40)), b('ice', x - 23, n * 40, 20, 60), c(x + 11, n * 40)];
const LEVELS = [
  { world: 'forest', name: 'First Raid', hogs: ['bramble', 'bramble', 'bramble'], items: [
    b('wood', 880, 0, 20, 80), b('wood', 960, 0, 20, 80), b('wood', 920, 80, 120, 20), c(920, 0), c(920, 100) ] },
  { world: 'forest', name: 'Ice House', hogs: ['bramble', 'zip', 'zip'], items: [
    b('ice', 820, 0, 20, 100), b('ice', 900, 0, 20, 100), b('ice', 980, 0, 20, 100), b('wood', 900, 100, 200, 20),
    c(860, 0), c(940, 0),
    b('wood', 860, 120, 20, 60), b('wood', 940, 120, 20, 60), b('wood', 900, 180, 120, 20), c(900, 120) ] },
  { world: 'forest', name: 'Stone Keep', hogs: ['bramble', 'thump', 'zip', 'thump'], items: [
    b('wood', 720, 0, 50, 50), b('wood', 720, 50, 50, 50), c(720, 100),
    b('stone', 850, 0, 24, 100), b('stone', 1000, 0, 24, 100), b('stone', 925, 100, 200, 24), c(925, 0),
    b('wood', 870, 124, 20, 70), b('wood', 980, 124, 20, 70), b('wood', 925, 194, 150, 20), c(925, 124) ] },
  { world: 'forest', name: 'Twin Towers', hogs: ['zip', 'blaze', 'bramble', 'blaze'], items: [
    ...tower(800, 'wood', 'ice'), b('stone', 920, 0, 60, 60), c(920, 60), ...tower(1040, 'stone', 'ice') ] },
  { world: 'forest', name: 'The Hoard', hogs: ['bramble', 'zip', 'thump', 'blaze', 'blaze', 'bramble'], items: [
    b('stone', 760, 0, 24, 110), b('stone', 880, 0, 24, 110), b('stone', 1000, 0, 24, 110), b('stone', 1120, 0, 24, 110),
    b('stone', 940, 110, 400, 20), c(820, 0), c(940, 0), c(1060, 0),
    b('wood', 820, 130, 20, 80), b('wood', 940, 130, 20, 80), b('wood', 1060, 130, 20, 80), b('wood', 940, 210, 280, 20),
    c(880, 130), c(1000, 130),
    b('ice', 900, 230, 20, 50), b('ice', 980, 230, 20, 50), b('ice', 940, 280, 120, 20), c(940, 230) ] },

  { world: 'peaks', name: 'Snowdrift', hogs: ['bramble', 'zip', 'zip', 'bramble'], items: [
    b('ice', 840, 0, 20, 70), b('ice', 910, 0, 20, 70), b('ice', 980, 0, 20, 70), b('ice', 910, 70, 180, 20),
    c(875, 0), c(945, 0), c(910, 90), b('wood', 1080, 0, 50, 50), c(1080, 50) ] },
  { world: 'peaks', name: 'Glacier Steps', hogs: ['zip', 'thump', 'bramble', 'zip'], items: [
    ...step(780, 1), ...step(900, 2), ...step(1020, 3) ] },
  { world: 'peaks', name: 'Avalanche Pass', hogs: ['bramble', 'thump', 'zip', 'bramble'], items: [
    b('stone', 700, 0, 60, 60), b('stone', 700, 60, 60, 60), b('stone', 700, 120, 50, 50),
    c(790, 0), b('ice', 860, 0, 20, 120), b('ice', 940, 0, 20, 120), b('ice', 900, 120, 120, 20), c(900, 0), c(900, 140),
    b('wood', 1010, 0, 50, 50), c(1010, 50), b('ice', 1090, 0, 20, 90), c(1140, 0) ] },
  { world: 'peaks', name: 'Frost Citadel', hogs: ['bramble', 'thump', 'blaze', 'zip', 'bramble'], items: [
    b('stone', 800, 0, 24, 90), b('stone', 900, 0, 24, 90), b('stone', 1000, 0, 24, 90), b('stone', 1100, 0, 24, 90),
    b('stone', 950, 90, 340, 20), c(850, 0), c(950, 0), c(1050, 0),
    b('ice', 850, 110, 20, 80), b('ice', 950, 110, 20, 80), b('ice', 1050, 110, 20, 80), b('ice', 950, 190, 240, 20),
    c(900, 110), c(1000, 110),
    b('wood', 915, 210, 20, 50), b('wood', 985, 210, 20, 50), b('wood', 950, 260, 110, 20), c(950, 210) ] },

  { world: 'canyon', name: 'Powder Trail', hogs: ['bramble', 'bramble', 'zip'], items: [
    b('wood', 840, 0, 20, 80), b('wood', 1020, 0, 20, 80), c(875, 0), b('keg', 930, 0, 40, 40), c(985, 0),
    b('wood', 930, 80, 220, 20), c(880, 100), b('keg', 930, 100, 40, 40), c(980, 100) ] },
  { world: 'canyon', name: 'Mesa Lookout', hogs: ['bramble', 'zip', 'thump', 'bramble'], items: [
    b('stone', 900, 0, 24, 120), b('stone', 980, 0, 24, 120), c(940, 0), b('stone', 940, 120, 130, 20),
    b('wood', 905, 140, 20, 100), b('wood', 975, 140, 20, 100), c(940, 140), b('wood', 940, 240, 120, 20),
    b('keg', 940, 260, 40, 40), c(940, 300),
    b('wood', 1070, 0, 20, 60), b('wood', 1130, 0, 20, 60), c(1100, 0), b('wood', 1100, 60, 100, 20), b('keg', 1100, 80, 40, 40) ] },
  { world: 'canyon', name: 'Dynamite Gulch', hogs: ['zip', 'bramble', 'blaze', 'thump'], items: [
    ...hut(770), c(855, 0), ...hut(940), c(1025, 0), ...hut(1110) ] },
  { world: 'canyon', name: 'Bandit Fortress', hogs: ['bramble', 'zip', 'thump', 'blaze', 'blaze', 'zip'], items: [
    b('stone', 740, 0, 30, 150),
    b('stone', 840, 0, 24, 100), b('stone', 960, 0, 24, 100), b('stone', 1080, 0, 24, 100), b('wood', 960, 100, 280, 20),
    c(900, 0), c(1020, 0),
    b('wood', 850, 120, 20, 70), b('wood', 1070, 120, 20, 70), c(905, 120), b('keg', 960, 120, 40, 40), c(1015, 120),
    b('wood', 960, 190, 260, 20),
    b('ice', 925, 210, 20, 50), b('ice', 995, 210, 20, 50), c(960, 210), b('ice', 960, 260, 110, 20),
    b('wood', 1140, 0, 20, 60), b('wood', 1200, 0, 20, 60), c(1170, 0), b('wood', 1170, 60, 100, 20) ] },
];

/* ---------- saved progress (per browser) ---------- */
let save = { best: { easy: {}, normal: {}, hard: {} }, unlocked: 0, diff: 'normal' };
try {
  const s = JSON.parse(localStorage.getItem('hedgehog-havoc') || 'null');
  if (s && s.best) {
    const best = s.best.normal ? s.best : { normal: s.best };   // older saves had one difficulty
    save = { best: Object.assign({ easy: {}, normal: {}, hard: {} }, best), unlocked: s.unlocked | 0, diff: DIFFS[s.diff] ? s.diff : 'normal' };
  }
} catch (e) {}
const persist = () => { try { localStorage.setItem('hedgehog-havoc', JSON.stringify(save)); } catch (e) {} };

/* ---------- sound ---------- */
let ac = null, muted = false, lastThud = 0;
function beep(f0, f1, d, type = 'sine', vol = 0.12) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}
const thud = () => { const n = performance.now(); if (n - lastThud > 90) { lastThud = n; beep(140, 60, 0.12, 'triangle', 0.14); } };

/* ---------- game state ---------- */
let engine, ents = [], parts = [], pops = [], trail = [], pierce = [];
const S = { level: 0, score: 0, phase: 'aim', queue: [], loaded: null, cur: null, drag: null, pull: { x: 0, y: 0 }, t: 0, still: 0, grace: 0, shake: 0, clearT: 0, launched: false };

function add(ent) { ent.body.plugin.ent = ent; Composite.add(engine.world, ent.body); ents.push(ent); return ent; }

function loadLevel(i) {
  const L = LEVELS[i], D = DIFFS[save.diff], world = WORLDS[L.world], repaint = !bg || LEVELS[S.level].world !== L.world;
  engine = Engine.create(); engine.gravity.y = 1; engine.positionIterations = 10; engine.velocityIterations = 8;
  ents = []; parts = []; pops = []; trail = []; pierce = [];
  Object.assign(S, { level: i, score: 0, phase: 'aim', queue: [...L.hogs, ...Array(D.extra).fill('bramble')], loaded: null, cur: null, drag: null, pull: { x: 0, y: 0 }, t: 0, still: 0, grace: 90, shake: 0, clearT: 0 });
  Composite.add(engine.world, Bodies.rectangle(W / 2, GY + 60, 4000, 120, { isStatic: true, friction: world.slip ? 0.02 : 1 }));
  L.items.forEach((it, n) => {
    if (it.k === 'block') {
      const m = MATS[it.mat];
      add({ kind: 'block', mat: it.mat, w: it.w, h: it.h, hp: m.hp * D.block, max: m.hp * D.block, seed: n * 7.3 + 1,
        body: Bodies.rectangle(it.x, GY - it.y - it.h / 2, it.w, it.h, { density: m.den, friction: 0.8, restitution: 0.05 }) });
    } else {
      add({ kind: 'coon', r: 22, hp: 22 * D.coon, max: 22 * D.coon,
        body: Bodies.circle(it.x, GY - it.y - 22, 22, { density: 0.001, friction: 0.7, restitution: 0.2 }) });
    }
  });
  Events.on(engine, 'collisionStart', onCollide);
  S.loaded = S.queue.shift();
  overlay.hidden = true;
  if (repaint) paintBg();
  hud();
}

const effMass = (other, self) => Math.max(2, Math.min(9, other.isStatic ? self.mass : other.mass));
function onCollide(e) {
  for (const p of e.pairs) {
    const A = p.bodyA, B = p.bodyB, ea = A.plugin.ent, eb = B.plugin.ent;
    const hogHit = (ea && ea.kind === 'hog') || (eb && eb.kind === 'hog');
    if (S.grace > 0 && !hogHit) continue;
    for (const h of [ea, eb]) if (h && h.kind === 'hog' && !h.hit) { h.hit = true; h.body.frictionAir = 0.015; }
    const rel = Math.hypot(A.velocity.x - B.velocity.x, A.velocity.y - B.velocity.y);
    if (rel < 2) continue;
    hit(ea, rel * effMass(B, A), eb); hit(eb, rel * effMass(A, B), ea);
  }
}
const gain = n => { const g = Math.round(n * DIFFS[save.diff].mult); S.score += g; return g; };
function hit(ent, force, by) {
  if (!ent || ent.dead || ent.kind === 'hog') return;
  damage(ent, force * 0.6 * (ent.kind === 'coon' ? 2 : 1), by);
}
function damage(ent, d, by) {
  gain(Math.max(0, Math.min(d, ent.hp)));
  ent.hp -= d;
  if (ent.hp <= 0) {
    kill(ent);
    if (by && by.kind === 'hog' && ent.kind === 'block') pierce.push({ body: by.body, vx: by.body.velocity.x, vy: by.body.velocity.y });
  } else if (d > 5) { burst(ent.body.position.x, ent.body.position.y, colorOf(ent), 3, 2); thud(); }
}
const colorOf = ent => ent.kind === 'block' ? MATS[ent.mat].fill : ent.kind === 'coon' ? '#a9adb8' : HOGS[ent.type].col;
function kill(ent) {
  if (ent.dead) return;
  ent.dead = true;
  const { x, y } = ent.body.position;
  if (ent.kind === 'coon') { pop(x, y, '+' + gain(500)); burst(x, y, '#e6e8ee', 16, 4); beep(520, 180, 0.25, 'square', 0.1); }
  else if (ent.kind === 'block' && ent.mat === 'keg') { gain(100); explode(x, y, 150, ent); }
  else if (ent.kind === 'block') { gain(100); burst(x, y, MATS[ent.mat].fill, 10, 3.5); beep(ent.mat === 'ice' ? 1400 : 220, ent.mat === 'ice' ? 500 : 70, 0.15, ent.mat === 'ice' ? 'sine' : 'sawtooth', 0.09); }
  else burst(x, y, '#f6ead7', 10, 3);
}
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = sp * (0.4 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 30 + Math.random() * 20, col, s: 3 + Math.random() * 5 }); }
}
const pop = (x, y, text) => pops.push({ x, y, text, life: 60 });

function explode(x, y, R, src) {
  for (const o of ents) {
    if (o === src || o.dead) continue;

    let x = hx, y = hy, vx = -S.pull.x * POWER, vy = -S.pull.y * POWER; const N = DIFFS[save.diff].dots; ctx.fillStyle = T.dot;
    for (let i = 1; i <= N; i++) { vy += G; x += vx; y += vy; if (y > GY) break;
      if (i % 4 === 0) { ctx.globalAlpha = 1 - i / (N * 1.3); ctx.beginPath(); ctx.arc(x, y, Math.max(2, 5 - i / 20), 0, 6.283); ctx.fill(); } }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = T.dot; ctx.globalAlpha = 0.5; for (const t of trail) { ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, 6.283); ctx.fill(); } ctx.globalAlpha = 1;
  if (S.loaded) drawHog(hx, hy, Math.atan2(-S.pull.y, -S.pull.x || 1) * (S.drag ? 1 : 0), S.loaded);
  ctx.strokeStyle = '#6b3f22'; ctx.lineWidth = 14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(AX, AY + 50); ctx.lineTo(AX - 20, AY - 6); ctx.stroke();
  if (S.loaded) { band(); ctx.beginPath(); ctx.moveTo(AX - 20, AY - 2); ctx.lineTo(hx - 6, hy + 2); ctx.stroke(); }
  for (const e of ents) { if (e.kind === 'block') drawBlock(e); }
  for (const e of ents) { if (e.kind === 'coon') drawCoon(e); else if (e.kind === 'hog') drawHog(e.body.position.x, e.body.position.y, e.body.angle, e.type); }
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.font = '30px "Titan One", "Arial Rounded MT Bold", sans-serif'; ctx.textAlign = 'center';
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life / 25); ctx.fillStyle = '#ffb347'; ctx.strokeStyle = '#3a2206'; ctx.lineWidth = 5; ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y); }
  ctx.globalAlpha = 1;
  if (!S.launched && S.phase === 'aim' && !S.drag) {
    ctx.fillStyle = T.dot; ctx.font = '26px "Titan One", "Arial Rounded MT Bold", sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('Drag back and let go', AX + 60, AY - 40);
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0, lastScore = -1;
function frame(now) {
  acc += Math.min(60, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n++ < 3) { if (S.phase !== 'over') tick(); acc -= 1000 / 60; }
  if (S.score !== lastScore) { lastScore = S.score; $('score').textContent = S.score.toLocaleString(); $('left').textContent = ents.filter(e => e.kind === 'coon').length; }
  draw();
  requestAnimationFrame(frame);
}

  resize();
  new ResizeObserver(resize).observe(play);
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ level: S.level }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
